<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecuamallorca · Carta digital</title>
<meta name="description" content="Carta digital de Ecuamallorca Bar · Restaurante. Cocina tradicional ecuatoriana en Mallorca.">
<meta name="theme-color" content="#FBF8F1">
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<a class="skip" href="#menu">Saltar a la carta</a>
<noscript><p style="padding:24px;text-align:center">Activa JavaScript para ver la carta.</p></noscript>

<div id="app">

<!-- PORTADA -->
<header class="hero" id="inicio">
  <div class="hero__dishes" id="heroDishes" aria-hidden="true"></div>
  <div class="hero__inner">
    <p class="eyebrow"><span data-bind="restaurant.kind"></span><i class="flag" aria-hidden="true"><b></b><b></b><b></b></i></p>
    <div class="hero__stage">
      <svg class="hero__arcs" viewBox="0 0 1000 500" aria-hidden="true" focusable="false">
        <circle cx="500" cy="500" r="498" class="arc arc--y"/>
        <circle cx="500" cy="500" r="388" class="arc arc--b"/>
        <circle cx="500" cy="500" r="278" class="arc arc--r"/>
        <circle cx="500" cy="500" r="176" class="arc arc--c"/>
      </svg>
      <img class="hero__logo" id="heroLogo" alt="" width="797" height="445" fetchpriority="high">
    </div>
    <h1 class="hero__title"><span data-bind="restaurant.tagline"></span> <em data-bind="restaurant.tagline2"></em></h1>
    <p class="hero__intro" data-bind="restaurant.intro"></p>
    <div class="hero__cta">
      <a class="btn btn--solid" href="#menu" data-go="carta">Ver la carta</a>
      <a class="btn btn--ghost" href="#bebidas" data-go="bebidas">Bebidas</a>
    </div>
  </div>
  <a class="hero__scroll" href="#menu" data-go="carta" aria-label="Ir a la carta"><span></span></a>
</header>

<!-- CINTA -->
<div class="ribbon" aria-hidden="true"><div class="ribbon__track" id="ribbon"></div></div>

<!-- ATAJOS (móvil) -->
<section class="picks" aria-labelledby="picksT">
  <div class="picks__head">
    <h2 id="picksT" class="picks__title">¿Qué te apetece?</h2>
    <p class="picks__sub">Toca una categoría</p>
  </div>
  <div class="picks__rail" id="picks"></div>
</section>

<main>
<!-- CARTA -->
<section class="carta" id="menu" aria-label="La carta">
  <nav class="bar" id="bar" aria-label="Categorías">
    <div class="bar__top">
      <a class="bar__logo" href="#inicio" aria-label="Volver arriba"><img id="barLogo" alt="" width="797" height="445"></a>
      <div class="tabs" id="tabs" role="group" aria-label="Secciones de la carta"></div>
      <button class="round bar__search" id="barSearch" type="button" aria-label="Buscar en la carta"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    </div>
    <div class="chips" id="chips"></div>
  </nav>

  <section class="strip" id="strip" hidden aria-labelledby="stripT">
    <div class="strip__head" data-reveal>
      <p class="kicker">Platos con alma ecuatoriana</p>
      <h2 id="stripT" class="h2">Nuestros clásicos</h2>
    </div>
    <div class="rail" id="rail" aria-label="Platos destacados"></div>
  </section>

  <div id="sections"></div>
</section>

<!-- GALERÍA -->
<section class="gallery" id="galeria" aria-labelledby="galT">
  <div class="wrap gallery__head" data-reveal>
    <p class="kicker">Del Pacífico a los Andes</p>
    <h2 id="galT" class="h2">Un pedacito de Ecuador <em>en tu mesa</em></h2>
    <i class="flag flag--lg" aria-hidden="true"><b></b><b></b><b></b></i>
  </div>
  <div class="wrap mosaic" id="mosaic"></div>
</section>
</main>

<!-- PIE -->
<footer class="foot" id="foot">
  <div class="foot__flag" aria-hidden="true"><b></b><b></b><b></b></div>
  <div class="wrap foot__in">
    <img id="footLogo" alt="" width="797" height="445" loading="lazy">
    <p class="foot__thanks">Gracias por visitarnos</p>
    <ul class="foot__links" id="footLinks"></ul>
    <p class="foot__note" id="footNote"></p>
    <p class="foot__copy"><span data-bind="restaurant.name"></span> · <span data-bind="restaurant.kind"></span></p>
  </div>
</footer>

<!-- BARRA INFERIOR (móvil) -->
<nav class="dock" id="dock" aria-label="Secciones de la carta">
  <div class="dock__tabs" id="dockTabs"><i class="dock__ind" aria-hidden="true"></i></div>
  <button class="dock__search" id="dockSearch" type="button" aria-label="Buscar en la carta"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
</nav>

</div><!-- /#app -->

<!-- BUSCADOR -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Buscar en la carta" inert>
  <div class="sheet__top">
    <label class="sheet__field">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span class="sr">Buscar plato o bebida</span>
      <input id="q" type="search" placeholder="Buscar plato o bebida…" autocomplete="off" autocapitalize="off" enterkeyhint="search">
      <button class="sheet__clear" id="qClear" type="button" aria-label="Borrar" hidden><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </label>
    <button class="sheet__close" id="sheetClose" type="button">Cerrar</button>
  </div>
  <div class="sheet__body" id="sheetBody" aria-live="polite"></div>
</div>

<script src="data/menu.js"></script>
<script src="js/app.js"></script>
</body>
</html>
