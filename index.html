<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecuamallorca · Bar · Restaurante</title>
<meta name="description" content="Ecuamallorca Bar · Restaurante. Mira la carta o déjanos tu reseña en Google.">
<meta name="theme-color" content="#FBF8F1">
<link rel="icon" href="assets/logo.webp" type="image/webp">
<script>
  /* Enlaces antiguos tipo …/#bebidas → se abren directamente en la carta */
  if (location.hash.length > 1) location.replace('carta.html' + location.hash);
</script>
<link rel="stylesheet" href="css/inicio.css">
<!-- La carta se descarga mientras el cliente lee esta página: al tocar «Menú» abre al instante -->
<link rel="prefetch" href="carta.html">
<link rel="prefetch" href="css/style.css">
<link rel="prefetch" href="js/app.js">
</head>
<body>

<main class="home" id="home">

  <div class="home__dishes" id="dishes" aria-hidden="true"></div>

  <header class="home__top">
    <i class="flag" aria-hidden="true"><b></b><b></b><b></b></i>
  </header>

  <div class="home__main">
  <section class="home__hero">
    <div class="stage">
      <svg class="stage__arcs" viewBox="0 0 1000 500" aria-hidden="true" focusable="false">
        <circle cx="500" cy="500" r="498" class="arc arc--y"/>
        <circle cx="500" cy="500" r="388" class="arc arc--b"/>
        <circle cx="500" cy="500" r="278" class="arc arc--r"/>
        <circle cx="500" cy="500" r="176" class="arc arc--c"/>
      </svg>
      <img class="stage__logo" id="logo" src="assets/logo.webp" alt="Ecuamallorca · Bar · Restaurante" width="797" height="445" fetchpriority="high">
    </div>
    <h1 class="welcome"><span data-bind="restaurant.tagline">Sabores del Ecuador</span> <em data-bind="restaurant.tagline2">en Mallorca</em></h1>
  </section>

  <nav class="actions" aria-label="¿Qué quieres hacer?" data-ta="aria-label">
    <a class="act act--menu" href="carta.html">
      <span class="act__ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M7 3v5a2.5 2.5 0 0 0 5 0V3M9.5 3v18"/><path d="M17.5 21V3c-2 1.4-3 4-3 7 0 1.8 1 3 3 3"/></svg>
      </span>
      <span class="act__txt"><strong data-t>Menú</strong><small data-t>Platos, bebidas y precios</small></span>
      <span class="act__go" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>

    <!-- El enlace se toma de data/menu.js → links.review (si está vacío, el botón no aparece) -->
    <a class="act act--review" id="reviewBtn" href="#" target="_blank" rel="noopener noreferrer" hidden>
      <span class="act__ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false" class="star"><path d="M12 3.4l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.7 6.8 19.4l1-5.8L3.6 9.5l5.8-.8L12 3.4z"/></svg>
      </span>
      <span class="act__txt"><strong data-t>Deja tu reseña</strong><small data-t>Cuéntanos qué tal estuvo</small></span>
      <span class="act__go" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </span>
    </a>
  </nav>
  </div>

  <footer class="home__foot">
    <p data-t>Gracias por visitarnos</p>
  </footer>

</main>

<script src="data/menu.js"></script>
<script src="data/en.js"></script>
<script src="js/i18n.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
